# Render Blueprint for the KinLAN API (docs/deploy.md). Free plan, Singapore region.
# Secrets are never stored here: DATABASE_URL* are entered in the Render dashboard (sync: false)
# and JWT_SECRET is generated by Render.
services:
  - type: web
    name: kinlan-api
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    branch: main
    autoDeployTrigger: checksPass # deploy main only after CI is green
    buildCommand: pip install -r requirements.txt
    # Free instances have no pre-deploy step, so migrations run before the server starts.
    # One process only: the scheduled jobs (heartbeats, rollups, retention) run inside it.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Neon pooled connection string (host contains -pooler)
        sync: false
      - key: DATABASE_URL_UNPOOLED # Neon direct connection string, for migrations
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:8081"]'
      - key: RUN_JOBS
        value: "true"
