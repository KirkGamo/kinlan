# Render Blueprint for KinLAN: the API and the web app (docs/deploy.md). Free plan, Singapore region.
# Secrets are never stored here: DATABASE_URL* are entered in the Render dashboard (sync: false)
# and JWT_SECRET is generated by Render.
services:
  - type: web
    name: kinlan-api
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    branch: main
    autoDeployTrigger: checksPass # deploy main only after CI is green
    # The warm-up fills Matplotlib's font cache inside the app folder (app/reports.py), so the
    # running server never spends seconds scanning fonts; a failure here never blocks a deploy.
    buildCommand: pip install -r requirements.txt && (python -m app.reports || echo "report warm-up skipped")
    # Free instances have no pre-deploy step, so migrations run before the server starts.
    # One process only: the scheduled jobs (heartbeats, rollups, retention) run inside it.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Neon pooled connection string (host contains -pooler)
        sync: false
      - key: DATABASE_URL_UNPOOLED # Neon direct connection string, for migrations
        sync: false
      - key: CORS_ORIGINS # Metro in development, and the web app below
        value: '["http://localhost:8081","https://kinlan-web.onrender.com"]'
      - key: RUN_JOBS
        value: "true"

  # The app's web build (issue #92): a single-page export of mobile/, served as static files.
  # Every path falls back to index.html so links like /site and /report open in the app.
  - type: web
    name: kinlan-web
    runtime: static
    rootDir: mobile
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["mobile/**"]
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable # file names change with their content
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        value: https://kinlan-api.onrender.com
