name: Agent release

# Pushing a tag like agent-v1.0.0 builds KinLAN-Agent.exe on Windows and publishes it as a
# GitHub Release (plan, Section 10.2). The tag must match kinlan_agent.__version__. Agent releases
# are marked "latest", so the app's download link (releases/latest/download/KinLAN-Agent.exe)
# always gets the newest agent; other kinds of release must be published with --latest=false.

on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt

      - name: Tag matches the agent's version
        shell: bash
        run: |
          version=$(python -c "import kinlan_agent; print(kinlan_agent.__version__)")
          if [ "agent-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match kinlan_agent.__version__ ($version)"; exit 1
          fi

      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: pyinstaller build/kinlan-agent.spec --noconfirm --distpath dist

      - name: Smoke test
        # The exe asks for administrator on launch; the runner already is one.
        run: dist\KinLAN-Agent.exe --version

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/KinLAN-Agent.exe \
            --title "KinLAN Agent ${GITHUB_REF_NAME#agent-v}" --latest \
            --notes "Windows agent for KinLAN. Download KinLAN-Agent.exe, run it, approve the administrator prompt, and enter the 6-digit code from the app. See the README for Npcap and the SmartScreen warning."
