name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    # The agent uses Windows-only APIs (DPAPI, schtasks), so it's tested on Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kinlan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kinlan_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q

  mobile:
    # Steps are skipped until the Expo app (mobile/package.json) is created in Sprint 3.
    # hashFiles() is only allowed in step-level conditions, not in a job-level `if`.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('mobile/package.json') != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: ${{ hashFiles('mobile/package.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('mobile/package.json') != '' }}
        run: npx tsc --noEmit
      - if: ${{ hashFiles('mobile/package.json') != '' }}
        run: npx eslint .
